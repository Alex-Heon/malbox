<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>말박스</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@1,500;1,600&family=Manrope:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
  :root {
    --bg: #eceee8;
    --surface: #ffffff;
    --surface-border: rgba(24, 32, 28, 0.10);
    --ink: #1c2622;
    --ink-soft: #5b6b63;
    --ink-faint: #8b988f;
    --accent: #2f6f62;
    --accent-ink: #ffffff;
    --accent-active: #d8592e;
    --accent-active-ink: #ffffff;
    --ring: rgba(47, 111, 98, 0.28);
    --ring-active: rgba(216, 89, 46, 0.30);
    --shadow: 0 1px 2px rgba(20, 26, 23, 0.06), 0 6px 16px -8px rgba(20, 26, 23, 0.18);
    --tint-teal: #dceee7;
    --tint-amber: #fbe6d3;
    --tint-blue: #dbe6f6;
    --tint-rose: #f8dde6;
    --tint-violet: #e9e1f7;
    --tape: #e0c294;
    --tape-edge: rgba(90, 62, 27, 0.35);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12160f;
      --surface: #1b211c;
      --surface-border: rgba(237, 239, 234, 0.10);
      --ink: #edefea;
      --ink-soft: #98a599;
      --ink-faint: #647065;
      --accent: #63b5a3;
      --accent-ink: #0d1512;
      --accent-active: #f0895a;
      --accent-active-ink: #1c0f08;
      --ring: rgba(99, 181, 163, 0.22);
      --ring-active: rgba(240, 137, 90, 0.24);
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px -8px rgba(0, 0, 0, 0.5);
      --tint-teal: #1f332e;
      --tint-amber: #3a2c1b;
      --tint-blue: #212b3c;
      --tint-rose: #3a2530;
      --tint-violet: #2c2440;
      --tape: #c9a668;
      --tape-edge: rgba(40, 26, 8, 0.45);
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #12160f;
    --surface: #1b211c;
    --surface-border: rgba(237, 239, 234, 0.10);
    --ink: #edefea;
    --ink-soft: #98a599;
    --ink-faint: #647065;
    --accent: #63b5a3;
    --accent-ink: #0d1512;
    --accent-active: #f0895a;
    --accent-active-ink: #1c0f08;
    --ring: rgba(99, 181, 163, 0.22);
    --ring-active: rgba(240, 137, 90, 0.24);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 20px -8px rgba(0, 0, 0, 0.5);
    --tint-teal: #1f332e;
    --tint-amber: #3a2c1b;
    --tint-blue: #212b3c;
    --tint-rose: #3a2530;
    --tint-violet: #2c2440;
    --tape: #c9a668;
    --tape-edge: rgba(40, 26, 8, 0.45);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Manrope', 'Noto Sans KR', sans-serif;
    height: 100dvh;
    overflow: hidden;
  }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 480px;
    margin: 0 auto;
    background: var(--bg);
  }

  .topbar {
    display: flex;
    flex-direction: column;
    padding: max(18px, env(safe-area-inset-top)) 22px 14px;
    flex-shrink: 0;
    gap: 10px;
  }

  .topbar-row-actions {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 10px;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }

  .logo-mark {
    flex-shrink: 0;
    width: 84px;
    height: 84px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-mark svg {
    width: 100%;
    height: 100%;
  }

  .brand-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    min-width: 0;
  }

  .wordmark {
    margin: 0;
    font-family: 'Fraunces', 'Noto Sans KR', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 68px;
    line-height: 1;
    letter-spacing: 0.01em;
    color: var(--ink);
  }

  .wordmark em {
    font-style: italic;
    color: var(--accent);
  }

  .tagline {
    margin: 0;
    font-family: 'Manrope', 'Noto Sans KR', sans-serif;
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }


  .count {
    font-variant-numeric: tabular-nums;
    font-size: 18px;
    color: var(--ink-faint);
    font-weight: 500;
  }

  .backup-actions {
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    color: var(--ink-soft);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .icon-btn svg {
    width: 20px;
    height: 20px;
  }

  .icon-btn:active {
    transform: scale(0.92);
  }

  .icon-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .stage {
    position: relative;
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }

  .stage-scroll {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 4px 18px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    -webkit-overflow-scrolling: touch;
  }

  .truck-lane {
    position: absolute;
    top: 2px;
    left: 0;
    right: 0;
    height: 44px;
    pointer-events: none;
    z-index: 5;
    overflow: visible;
  }

  .truck-lane[hidden] {
    display: none;
  }

  .truck {
    position: absolute;
    top: 0;
    left: -90px;
    width: 84px;
    height: 42px;
  }

  .truck-lane.driving .truck {
    animation-name: truck-drive;
    animation-timing-function: linear;
    animation-fill-mode: forwards;
  }

  @keyframes truck-drive {
    0% { left: -90px; opacity: 0; }
    9% { opacity: 1; }
    88% { opacity: 1; }
    100% { left: calc(100% + 20px); opacity: 0; }
  }

  .empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 30px;
  }

  .empty[hidden] {
    display: none;
  }

  .empty p {
    margin: 0;
    color: var(--ink-faint);
    font-size: 17px;
    line-height: 1.6;
  }

  .box-row {
    display: flex;
    align-items: stretch;
    gap: 8px;
  }

  .box-row.removing {
    animation: dismiss 0.28s ease forwards;
    pointer-events: none;
  }

  .box {
    position: relative;
    flex: 1;
    min-width: 0;
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 20px;
    box-shadow: var(--shadow);
    padding: 26px 24px;
    font-family: 'Noto Sans KR', 'Manrope', sans-serif;
    font-size: 58px;
    line-height: 1.35;
    color: var(--ink);
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
    transform-origin: center;
    transition: transform 0.12s ease, background 0.2s ease;
    cursor: pointer;
  }

  .box-row .box {
    animation: appear 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .box-tools {
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 16px;
    flex-shrink: 0;
  }

  .tool-btn {
    width: 92px;
    height: 92px;
    border-radius: 50%;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    color: var(--ink-soft);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Manrope', 'Noto Sans KR', sans-serif;
    font-weight: 700;
    font-size: 28px;
    cursor: pointer;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  .tool-btn:active {
    transform: scale(0.94);
  }

  .tool-btn:focus-visible,
  .mic:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .tool-color .swatch {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--surface-border);
    background: var(--surface);
  }

  .tool-check {
    display: none;
  }

  .tool-check .check-icon {
    width: 38px;
    height: 38px;
    opacity: 0.25;
  }

  .box-row.selecting .tool-color,
  .box-row.selecting .tool-size {
    display: none;
  }

  .box-row.selecting .tool-check {
    display: flex;
  }

  .box.selected {
    outline: 3px solid var(--accent);
    outline-offset: -3px;
  }

  .box.selected + .box-tools .tool-check .check-icon {
    opacity: 1;
    color: var(--accent);
  }

  .box::before {
    content: "";
    position: absolute;
    inset: 0;
    background: var(--accent-active);
    opacity: 0.16;
    width: 0%;
    z-index: 0;
    pointer-events: none;
  }

  .box.holding::before {
    width: 100%;
    transition: width 0.62s linear;
  }

  .box.holding {
    transform: scale(0.98);
  }

  .box .box-text {
    position: relative;
    z-index: 1;
  }

  .box.sealing {
    transform: scale(0.98);
  }

  .box.sealing .box-text {
    transition: opacity 0.25s ease 0.2s;
    opacity: 0.35;
  }

  .tape {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 145%;
    height: 15%;
    min-height: 20px;
    background:
      linear-gradient(rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0) 35%, rgba(0, 0, 0, 0.05) 100%),
      var(--tape);
    border-top: 1px solid rgba(255, 255, 255, 0.35);
    border-bottom: 1px solid var(--tape-edge);
    box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
    z-index: 3;
    opacity: 0;
    pointer-events: none;
    transform: translate(-50%, -50%) rotate(var(--rot)) scaleX(0);
    transform-origin: center;
  }

  .tape-1 { --rot: -38deg; }
  .tape-2 { --rot: 38deg; }

  .box.sealing .tape-1 {
    animation: tape-in 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  .box.sealing .tape-2 {
    animation: tape-in 0.3s cubic-bezier(0.22, 1, 0.36, 1) 0.16s forwards;
  }

  @keyframes tape-in {
    0% { opacity: 0; transform: translate(-50%, -50%) rotate(var(--rot)) scaleX(0); }
    55% { opacity: 1; }
    100% { opacity: 1; transform: translate(-50%, -50%) rotate(var(--rot)) scaleX(1); }
  }

  @keyframes appear {
    from { opacity: 0; transform: translateY(8px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .box-row .box.drop-in {
    animation-name: drop-in;
    animation-duration: 0.5s;
    animation-timing-function: cubic-bezier(0.34, 1.56, 0.64, 1);
    animation-fill-mode: both;
  }

  @keyframes drop-in {
    0% { opacity: 0; transform: translateY(-70px) rotate(-7deg) scale(0.92); }
    58% { opacity: 1; transform: translateY(6px) rotate(2deg) scale(1.02); }
    80% { transform: translateY(-2px) rotate(-1deg) scale(1); }
    100% { opacity: 1; transform: translateY(0) rotate(0deg) scale(1); }
  }

  @keyframes dismiss {
    to { opacity: 0; transform: scale(0.82); max-height: 0; margin: 0; padding-top: 0; padding-bottom: 0; }
  }

  .dock {
    flex-shrink: 0;
    padding: 10px 20px max(18px, env(safe-area-inset-bottom));
  }

  .dock-normal {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
  }

  .dock-normal[hidden] {
    display: none;
  }

  .dock-select {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  .dock-select[hidden] {
    display: none;
  }

  .select-summary {
    margin: 0;
    font-size: 18px;
    font-weight: 600;
    color: var(--ink);
  }

  .select-actions {
    display: flex;
    gap: 10px;
    width: 100%;
    justify-content: center;
  }

  .pill-btn {
    border: 1px solid var(--surface-border);
    background: var(--surface);
    color: var(--ink);
    border-radius: 999px;
    padding: 14px 18px;
    font-family: 'Manrope', 'Noto Sans KR', sans-serif;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: var(--shadow);
    -webkit-tap-highlight-color: transparent;
  }

  .pill-btn:active {
    transform: scale(0.96);
  }

  .pill-btn-accent {
    background: var(--accent);
    color: var(--accent-ink);
    border-color: transparent;
  }

  .status {
    margin: 0;
    font-size: 17px;
    font-weight: 500;
    color: var(--ink-soft);
    min-height: 19px;
  }

  .interim {
    margin: 0;
    font-size: 22px;
    line-height: 1.35;
    color: var(--ink-faint);
    min-height: 16px;
    max-height: 3.6em;
    max-width: 92%;
    overflow-y: auto;
    text-align: center;
    white-space: normal;
    word-break: keep-all;
    overflow-wrap: break-word;
  }

  .mic {
    position: relative;
    width: 200px;
    height: 200px;
    border-radius: 50%;
    border: none;
    background: var(--accent);
    color: var(--accent-ink);
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow);
    cursor: pointer;
    flex-shrink: 0;
    -webkit-tap-highlight-color: transparent;
  }

  .mic svg { width: 78px; height: 78px; position: relative; z-index: 2; }

  .mic-rings { position: absolute; inset: 0; border-radius: 50%; pointer-events: none; }

  .mic.listening {
    background: var(--accent-active);
    color: var(--accent-active-ink);
  }

  .mic.listening .mic-rings::before,
  .mic.listening .mic-rings::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: var(--ring-active);
    animation: pulse 1.8s ease-out infinite;
  }

  .mic.listening .mic-rings::after {
    animation-delay: 0.6s;
  }

  .mic:not(.listening) .mic-rings::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
    box-shadow: 0 0 0 6px var(--ring);
    opacity: 0.5;
  }

  @keyframes pulse {
    from { transform: scale(1); opacity: 0.55; }
    to { transform: scale(2.1); opacity: 0; }
  }

  .mic:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .hint {
    margin: 2px 0 0;
    font-size: 14px;
    color: var(--ink-faint);
    letter-spacing: 0.01em;
  }

  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(10, 14, 11, 0.45);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    z-index: 20;
  }

  .modal-backdrop[hidden] {
    display: none;
  }

  .modal-card {
    background: var(--surface);
    border-radius: 22px;
    padding: 26px 22px;
    max-width: 340px;
    width: 100%;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    gap: 8px;
    text-align: center;
  }

  .modal-title {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    color: var(--ink);
  }

  .modal-desc {
    margin: 0 0 8px;
    font-size: 15px;
    line-height: 1.5;
    color: var(--ink-soft);
  }

  .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .modal-actions .pill-btn {
    width: 100%;
  }

  @media (prefers-reduced-motion: reduce) {
    .box, .box-row.removing, .box.drop-in { animation: none; }
    .box.sealing .tape-1, .box.sealing .tape-2 { animation: none; }
    .mic.listening .mic-rings::before, .mic.listening .mic-rings::after { animation: none; opacity: 0.3; }
    .truck-lane { display: none; }
  }
</style>
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="logo-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64">
          <rect x="4" y="8" width="56" height="48" rx="10" fill="none" stroke="var(--accent)" stroke-width="3.5"/>
          <g fill="var(--accent)">
            <rect x="12" y="30" width="28" height="14" rx="7"/>
            <polygon points="32,32 36,17 43,17 40,34"/>
            <polygon points="36,16 49,12 53,18 48,23 38,22"/>
            <polygon points="39,12 41,6 44,13"/>
            <polygon points="34,18 30,20 34,22"/>
            <polygon points="33,23 29,25 33,27"/>
            <polygon points="12,31 6,35 8,40 13,37"/>
            <rect x="15" y="44" width="3.5" height="12" rx="1.2"/>
            <rect x="21" y="44" width="3.5" height="12" rx="1.2"/>
            <rect x="28" y="44" width="3.5" height="12" rx="1.2"/>
            <rect x="34" y="44" width="3.5" height="12" rx="1.2"/>
            <circle cx="48" cy="17" r="1.5" fill="var(--surface)"/>
          </g>
        </svg>
      </div>
      <div class="brand-text">
        <h1 class="wordmark"><em>말</em>박스</h1>
        <p class="tagline">Horse box</p>
      </div>
    </div>
    <div class="topbar-row-actions">
      <span class="count" id="count">0개</span>
      <div class="backup-actions">
        <button type="button" class="icon-btn" id="exportBtn" aria-label="메모를 코드로 복사하기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"></path>
            <path d="M7 10l5 5 5-5"></path>
            <path d="M5 21h14"></path>
          </svg>
        </button>
        <button type="button" class="icon-btn" id="importBtn" aria-label="코드로 메모 불러오기">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21V9"></path>
            <path d="M7 14l5-5 5 5"></path>
            <path d="M5 3h14"></path>
          </svg>
        </button>
      </div>
    </div>
  </header>

  <main class="stage" id="stage">
    <div class="truck-lane" id="truckLane" hidden aria-hidden="true">
      <svg class="truck" viewBox="0 0 84 42">
        <rect x="2" y="31" width="80" height="2.5" rx="1.25" fill="var(--ink-faint)" opacity="0.5"></rect>
        <rect x="4" y="8" width="44" height="23" rx="3" fill="var(--tape)" stroke="var(--tape-edge)" stroke-width="1"></rect>
        <rect x="4" y="17.5" width="44" height="2" fill="var(--tape-edge)" opacity="0.5"></rect>
        <rect x="50" y="15" width="27" height="16" rx="4" fill="var(--accent)"></rect>
        <rect x="56" y="18.5" width="14" height="8" rx="2" fill="var(--surface)" opacity="0.9"></rect>
        <circle cx="76" cy="26" r="1.8" fill="var(--accent-active)"></circle>
        <circle cx="18" cy="34" r="6.5" fill="var(--ink)"></circle>
        <circle cx="64" cy="34" r="6.5" fill="var(--ink)"></circle>
        <circle cx="18" cy="34" r="2.5" fill="var(--surface)"></circle>
        <circle cx="64" cy="34" r="2.5" fill="var(--surface)"></circle>
      </svg>
    </div>
    <div class="stage-scroll" id="stageScroll">
      <div class="empty" id="empty">
        <p>마이크를 눌러<br>첫 메모를 남겨보세요</p>
      </div>
    </div>
  </main>

  <footer class="dock">
    <div class="dock-normal" id="dockNormal">
      <p class="status" id="status">눌러서 시작</p>
      <p class="interim" id="interim" aria-live="polite"></p>
      <button class="mic" id="micBtn" aria-label="음성 입력 시작">
        <span class="mic-rings" aria-hidden="true"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
          <path d="M19 10v1a7 7 0 0 1-14 0v-1"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </button>
      <p class="hint">꾹 누르면 삭제 · 옆 버튼으로 색·크기 변경</p>
    </div>
    <div class="dock-select" id="dockSelect" hidden>
      <p class="select-summary" id="selectSummary">0개 선택됨</p>
      <div class="select-actions">
        <button type="button" class="pill-btn" id="selectCancelBtn">취소</button>
        <button type="button" class="pill-btn" id="selectAllBtn">전체 해제</button>
        <button type="button" class="pill-btn pill-btn-accent" id="selectConfirmBtn">코드 만들기</button>
      </div>
    </div>
  </footer>

  <div class="modal-backdrop" id="importChoice" role="dialog" aria-modal="true" aria-labelledby="importChoiceTitle" hidden>
    <div class="modal-card">
      <p class="modal-title" id="importChoiceTitle">코드로 메모를 불러올까요?</p>
      <p class="modal-desc">지금 있는 메모 <span id="importChoiceCount">0</span>개는 그대로 두고<br>새 메모를 더할 수도 있어요.</p>
      <div class="modal-actions">
        <button type="button" class="pill-btn pill-btn-accent" id="importAddBtn">추가하기</button>
        <button type="button" class="pill-btn" id="importReplaceBtn">교체하기 (기존 메모 삭제)</button>
        <button type="button" class="pill-btn" id="importCancelBtn">취소</button>
      </div>
    </div>
  </div>
</div>

<script>
(function () {
  var stage = document.getElementById('stage');
  var stageScroll = document.getElementById('stageScroll');
  var empty = document.getElementById('empty');
  var count = document.getElementById('count');
  var status = document.getElementById('status');
  var interim = document.getElementById('interim');
  var micBtn = document.getElementById('micBtn');
  var exportBtn = document.getElementById('exportBtn');
  var importBtn = document.getElementById('importBtn');
  var truckLane = document.getElementById('truckLane');
  var truckEl = truckLane ? truckLane.querySelector('.truck') : null;
  var dockNormal = document.getElementById('dockNormal');
  var dockSelect = document.getElementById('dockSelect');
  var selectSummary = document.getElementById('selectSummary');
  var selectCancelBtn = document.getElementById('selectCancelBtn');
  var selectAllBtn = document.getElementById('selectAllBtn');
  var selectConfirmBtn = document.getElementById('selectConfirmBtn');
  var importChoice = document.getElementById('importChoice');
  var importChoiceCount = document.getElementById('importChoiceCount');
  var importAddBtn = document.getElementById('importAddBtn');
  var importReplaceBtn = document.getElementById('importReplaceBtn');
  var importCancelBtn = document.getElementById('importCancelBtn');

  var STORAGE_KEY = 'malbox.boxes.v1';
  var HOLD_MS = 620;
  var boxes = [];
  var nextId = 1;
  var selectionMode = false;
  var selectedIds = new Set();

  var TINTS = ['', 'var(--tint-teal)', 'var(--tint-amber)', 'var(--tint-blue)', 'var(--tint-rose)', 'var(--tint-violet)'];
  var SIZES = [58, 78, 98];

  function randomTint() {
    return 1 + Math.floor(Math.random() * (TINTS.length - 1));
  }

  function loadBoxes() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return [];
      var parsed = JSON.parse(raw);
      if (!Array.isArray(parsed)) return [];
      return parsed.filter(function (b) { return b && typeof b.text === 'string'; });
    } catch (e) {
      return [];
    }
  }

  function saveBoxes() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(boxes.map(function (b) {
        return { id: b.id, text: b.text, tint: b.tint, size: b.size };
      })));
    } catch (e) {
      /* ignore persistence failures */
    }
  }

  function updateCount() {
    count.textContent = boxes.length + '개';
  }

  function syncEmptyState() {
    empty.hidden = boxes.length > 0;
  }

  function attachHoldToDelete(el, id) {
    var timer = null;
    var holding = false;

    function startHold(e) {
      if (holding || selectionMode) return;
      holding = true;
      void el.offsetWidth;
      el.classList.add('holding');
      timer = setTimeout(function () {
        if (holding) removeBox(id);
      }, HOLD_MS);
    }

    function cancelHold() {
      if (!holding) return;
      holding = false;
      clearTimeout(timer);
      el.classList.remove('holding');
    }

    el.addEventListener('pointerdown', startHold);
    el.addEventListener('pointerup', cancelHold);
    el.addEventListener('pointercancel', cancelHold);
    el.addEventListener('pointerleave', cancelHold);
    el.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }

  function applyTint(box) {
    box.el.style.background = TINTS[box.tint] || '';
    var next = TINTS[(box.tint + 1) % TINTS.length];
    box.swatch.style.background = next || 'var(--surface)';
  }

  function applySize(box) {
    box.textEl.style.fontSize = SIZES[box.size] + 'px';
  }

  function attachBoxTools(box) {
    function stop(e) { e.stopPropagation(); }
    [box.colorBtn, box.sizeBtn, box.checkBtn].forEach(function (btn) {
      btn.addEventListener('pointerdown', stop);
      btn.addEventListener('pointerup', stop);
      btn.addEventListener('pointercancel', stop);
    });

    box.colorBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      box.tint = (box.tint + 1) % TINTS.length;
      applyTint(box);
      saveBoxes();
    });

    box.sizeBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      box.size = (box.size + 1) % SIZES.length;
      applySize(box);
      saveBoxes();
    });

    box.checkBtn.addEventListener('click', function (e) {
      e.stopPropagation();
      toggleSelect(box);
    });
  }

  function toggleSelect(box) {
    if (selectedIds.has(box.id)) {
      selectedIds.delete(box.id);
      box.el.classList.remove('selected');
    } else {
      selectedIds.add(box.id);
      box.el.classList.add('selected');
    }
    updateSelectionSummary();
  }

  function updateSelectionSummary() {
    selectSummary.textContent = selectedIds.size + '개 선택됨';
    selectAllBtn.textContent = (selectedIds.size >= boxes.length) ? '전체 해제' : '전체 선택';
  }

  function enterSelectionMode() {
    if (!boxes.length) {
      flashStatus('내보낼 메모가 없어요');
      return;
    }
    selectionMode = true;
    selectedIds = new Set(boxes.map(function (b) { return b.id; }));
    boxes.forEach(function (b) {
      b.row.classList.add('selecting');
      b.el.classList.add('selected');
    });
    updateSelectionSummary();
    dockNormal.hidden = true;
    dockSelect.hidden = false;
  }

  function exitSelectionMode() {
    selectionMode = false;
    selectedIds.clear();
    boxes.forEach(function (b) {
      b.row.classList.remove('selecting');
      b.el.classList.remove('selected');
    });
    dockSelect.hidden = true;
    dockNormal.hidden = false;
  }

  function addBox(text, opts) {
    text = (text || '').trim();
    if (!text) return;
    opts = opts || {};

    var id = nextId++;
    var row = document.createElement('div');
    row.className = 'box-row';

    var el = document.createElement('div');
    el.className = 'box';
    el.dataset.id = String(id);
    var span = document.createElement('span');
    span.className = 'box-text';
    span.textContent = text;
    el.appendChild(span);
    var tape1 = document.createElement('span');
    tape1.className = 'tape tape-1';
    tape1.setAttribute('aria-hidden', 'true');
    var tape2 = document.createElement('span');
    tape2.className = 'tape tape-2';
    tape2.setAttribute('aria-hidden', 'true');
    el.appendChild(tape1);
    el.appendChild(tape2);
    if (opts.dropIn) el.classList.add('drop-in');
    if (opts.noAnimate) el.style.animation = 'none';

    var tools = document.createElement('div');
    tools.className = 'box-tools';
    tools.innerHTML =
      '<button type="button" class="tool-btn tool-color" aria-label="박스 색 바꾸기"><span class="swatch"></span></button>' +
      '<button type="button" class="tool-btn tool-size" aria-label="글자 크기 바꾸기">A+</button>' +
      '<button type="button" class="tool-btn tool-check" aria-label="선택하기"><svg class="check-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5 11-11"></path></svg></button>';

    row.appendChild(el);
    row.appendChild(tools);
    stageScroll.appendChild(row);

    var box = {
      id: id,
      text: text,
      row: row,
      el: el,
      textEl: span,
      colorBtn: tools.querySelector('.tool-color'),
      sizeBtn: tools.querySelector('.tool-size'),
      checkBtn: tools.querySelector('.tool-check'),
      swatch: tools.querySelector('.swatch'),
      tint: (typeof opts.tint === 'number') ? opts.tint : randomTint(),
      size: opts.size || 0
    };

    applyTint(box);
    applySize(box);
    attachBoxTools(box);
    attachHoldToDelete(el, id);
    el.addEventListener('click', function (e) {
      if (!selectionMode) return;
      e.stopPropagation();
      toggleSelect(box);
    });
    boxes.push(box);
    if (selectionMode) {
      selectedIds.add(box.id);
      row.classList.add('selecting');
      el.classList.add('selected');
      updateSelectionSummary();
    }
    updateCount();
    syncEmptyState();
    if (opts.persist !== false) saveBoxes();
    stageScroll.scrollTop = stageScroll.scrollHeight;
  }

  var REDUCED_MOTION = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var SEAL_MS = REDUCED_MOTION ? 0 : 480;

  function removeBox(id) {
    var idx = boxes.findIndex(function (b) { return b.id === id; });
    if (idx === -1) return;
    var entry = boxes[idx];
    boxes.splice(idx, 1);
    selectedIds.delete(id);
    saveBoxes();
    updateCount();
    if (navigator.vibrate) { try { navigator.vibrate([12, 40, 12]); } catch (e) {} }

    entry.el.classList.remove('holding');
    entry.el.classList.add('sealing');

    setTimeout(function () {
      entry.row.classList.add('removing');
      entry.row.addEventListener('animationend', function (e) {
        if (e.target !== entry.row) return;
        if (entry.row.parentNode) entry.row.parentNode.removeChild(entry.row);
        syncEmptyState();
      });
    }, SEAL_MS);
  }

  var CODE_PREFIX = 'MALBOX1:';
  var TRUCK_LEAD_MS = 260;
  var DROP_STEP_MS = 260;
  var statusResetTimer = null;

  function playTruckDelivery(count) {
    if (!truckLane || !truckEl || REDUCED_MOTION || !count) return;
    var total = TRUCK_LEAD_MS + count * DROP_STEP_MS + 420;
    truckLane.classList.remove('driving');
    truckLane.hidden = false;
    void truckEl.offsetWidth;
    truckEl.style.animationDuration = total + 'ms';
    truckLane.classList.add('driving');
    setTimeout(function () {
      truckLane.classList.remove('driving');
      truckLane.hidden = true;
    }, total + 60);
  }

  function flashStatus(message) {
    clearTimeout(statusResetTimer);
    status.textContent = message;
    statusResetTimer = setTimeout(function () {
      status.textContent = '눌러서 시작';
    }, 1800);
  }

  function encodeUnicode(str) {
    var bytes = new TextEncoder().encode(str);
    var binary = '';
    for (var i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
    return btoa(binary);
  }

  function decodeUnicode(b64) {
    var binary = atob(b64);
    var bytes = new Uint8Array(binary.length);
    for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return new TextDecoder().decode(bytes);
  }

  function buildExportCode(list) {
    var payload = (list || boxes).map(function (b) {
      return { t: b.text, c: b.tint, s: b.size };
    });
    return CODE_PREFIX + encodeUnicode(JSON.stringify(payload));
  }

  function copyCode(code) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(code).then(function () {
        flashStatus('코드가 복사됐어요');
      }).catch(function () {
        window.prompt('아래 코드를 복사해 보관하세요', code);
      });
    } else {
      window.prompt('아래 코드를 복사해 보관하세요', code);
    }
  }

  selectCancelBtn.addEventListener('click', exitSelectionMode);

  selectAllBtn.addEventListener('click', function () {
    if (selectedIds.size >= boxes.length) {
      selectedIds.clear();
      boxes.forEach(function (b) { b.el.classList.remove('selected'); });
    } else {
      selectedIds = new Set(boxes.map(function (b) { return b.id; }));
      boxes.forEach(function (b) { b.el.classList.add('selected'); });
    }
    updateSelectionSummary();
  });

  selectConfirmBtn.addEventListener('click', function () {
    if (!selectedIds.size) {
      flashStatus('선택된 메모가 없어요');
      return;
    }
    var chosen = boxes.filter(function (b) { return selectedIds.has(b.id); });
    var code = buildExportCode(chosen);
    exitSelectionMode();
    copyCode(code);
  });

  function importBoxes() {
    if (selectionMode) exitSelectionMode();
    var input = window.prompt('복사해둔 코드를 여기에 붙여넣으세요');
    if (input === null) return;
    input = input.trim();
    if (!input) return;

    if (input.indexOf(CODE_PREFIX) !== 0) {
      window.alert('코드를 알아볼 수 없어요. 복사한 코드가 맞는지 확인해주세요.');
      return;
    }

    var parsed;
    try {
      parsed = JSON.parse(decodeUnicode(input.slice(CODE_PREFIX.length)));
      if (!Array.isArray(parsed)) throw new Error('invalid');
    } catch (e) {
      window.alert('코드를 읽을 수 없어요. 복사한 코드가 맞는지 확인해주세요.');
      return;
    }

    var items = parsed.filter(function (item) {
      return item && typeof item.t === 'string' && item.t.trim();
    });

    if (!items.length) {
      window.alert('코드 안에 메모가 없어요.');
      return;
    }

    if (boxes.length) {
      openImportChoice(items);
    } else {
      runImport(items, false);
    }
  }

  function openImportChoice(items) {
    importChoiceCount.textContent = boxes.length;
    importChoice.hidden = false;

    function cleanup() {
      importChoice.hidden = true;
      importAddBtn.removeEventListener('click', onAdd);
      importReplaceBtn.removeEventListener('click', onReplace);
      importCancelBtn.removeEventListener('click', onCancel);
      importChoice.removeEventListener('click', onBackdropClick);
      document.removeEventListener('keydown', onKeydown);
    }
    function onAdd() { cleanup(); runImport(items, false); }
    function onReplace() { cleanup(); runImport(items, true); }
    function onCancel() { cleanup(); }
    function onBackdropClick(e) { if (e.target === importChoice) cleanup(); }
    function onKeydown(e) { if (e.key === 'Escape') cleanup(); }

    importAddBtn.addEventListener('click', onAdd);
    importReplaceBtn.addEventListener('click', onReplace);
    importCancelBtn.addEventListener('click', onCancel);
    importChoice.addEventListener('click', onBackdropClick);
    document.addEventListener('keydown', onKeydown);
  }

  function runImport(items, replace) {
    if (replace) {
      boxes.slice().forEach(function (b) {
        if (b.row.parentNode) b.row.parentNode.removeChild(b.row);
      });
      boxes = [];
      selectedIds.clear();
    }

    function finishImport() {
      updateCount();
      syncEmptyState();
      saveBoxes();
      flashStatus(replace ? '메모를 바꿨어요' : '메모를 더했어요');
    }

    playTruckDelivery(items.length);
    var leadMs = REDUCED_MOTION ? 0 : TRUCK_LEAD_MS;
    var stepMs = REDUCED_MOTION ? 0 : DROP_STEP_MS;

    items.forEach(function (item, i) {
      setTimeout(function () {
        addBox(item.t, { dropIn: !REDUCED_MOTION, persist: false, tint: item.c || 0, size: item.s || 0 });
        if (i === items.length - 1) finishImport();
      }, leadMs + i * stepMs);
    });
  }

  exportBtn.addEventListener('click', enterSelectionMode);
  importBtn.addEventListener('click', importBoxes);

  loadBoxes().forEach(function (b) {
    nextId = Math.max(nextId, b.id + 1);
    addBox(b.text, { noAnimate: true, persist: false, tint: b.tint || 0, size: b.size || 0 });
  });

  var SpeechRecognitionCtor = window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognitionCtor) {
    status.textContent = '이 브라우저는 음성 인식을 지원하지 않아요';
    micBtn.disabled = true;
  } else {
    var recognition = new SpeechRecognitionCtor();
    recognition.lang = 'ko-KR';
    recognition.continuous = false;
    recognition.interimResults = true;

    var isListening = false;
    var restartTimer = null;
    var autoOffTimer = null;
    var quickEndCount = 0;
    var lastStartAt = 0;
    var AUTO_OFF_MS = 10000;

    function setListeningUI(on) {
      micBtn.classList.toggle('listening', on);
      micBtn.setAttribute('aria-label', on ? '음성 입력 중지' : '음성 입력 시작');
      if (on) status.textContent = '듣는 중...';
      if (!on) interim.textContent = '';
    }

    function stopListening(message) {
      isListening = false;
      clearTimeout(restartTimer);
      clearTimeout(autoOffTimer);
      setListeningUI(false);
      status.textContent = message || '눌러서 시작';
      try { recognition.stop(); } catch (e) {}
    }

    function startRecognition() {
      try {
        lastStartAt = Date.now();
        recognition.start();
      } catch (e) {
        /* already started; ignore */
      }
    }

    function ensureMicAccess() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        return Promise.resolve();
      }
      return navigator.mediaDevices.getUserMedia({ audio: true }).then(function (stream) {
        stream.getTracks().forEach(function (t) { t.stop(); });
      });
    }

    recognition.onresult = function (event) {
      var interimText = '';
      var finalText = '';
      for (var i = event.resultIndex; i < event.results.length; i++) {
        var result = event.results[i];
        if (result.isFinal) {
          finalText += result[0].transcript;
        } else {
          interimText += result[0].transcript;
        }
      }
      if (finalText.trim()) {
        addBox(finalText);
        interim.textContent = '';
      } else {
        interim.textContent = interimText;
      }
    };

    recognition.onerror = function (event) {
      if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
        stopListening('마이크 접근이 차단됐어요 (설정에서 확인해주세요)');
      } else if (event.error === 'audio-capture') {
        stopListening('마이크를 찾을 수 없어요');
      }
      /* other errors (no-speech, network, aborted) are handled by onend restart */
    };

    recognition.onend = function () {
      if (!isListening) return;
      var elapsed = Date.now() - lastStartAt;
      quickEndCount = elapsed < 350 ? quickEndCount + 1 : 0;
      if (quickEndCount > 4) {
        stopListening('다시 눌러서 시작해주세요');
        return;
      }
      restartTimer = setTimeout(startRecognition, 150);
    };

    micBtn.addEventListener('click', function () {
      clearTimeout(restartTimer);
      if (!isListening) {
        isListening = true;
        quickEndCount = 0;
        micBtn.classList.add('listening');
        status.textContent = '마이크 확인 중...';
        ensureMicAccess().then(function () {
          if (!isListening) return;
          setListeningUI(true);
          startRecognition();
          clearTimeout(autoOffTimer);
          autoOffTimer = setTimeout(function () {
            stopListening('시간이 지나 마이크가 꺼졌어요');
          }, AUTO_OFF_MS);
        }).catch(function (err) {
          isListening = false;
          setListeningUI(false);
          var reason = err && err.name ? err.name : '';
          if (reason === 'NotFoundError') {
            status.textContent = '마이크를 찾을 수 없어요';
          } else if (reason === 'SecurityError') {
            status.textContent = '이 화면에서는 마이크를 쓸 수 없어요 (새 탭에서 열어보세요)';
          } else {
            status.textContent = '마이크 접근이 차단됐어요 (설정에서 확인해주세요)';
          }
        });
      } else {
        stopListening();
      }
    });
  }
})();
</script>
</body>
</html>
